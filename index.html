<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 핫딜 대첩</title>
<meta name="description" content="토스쇼핑 오늘의 특가를 할인율 순으로 정리했어요. 품절 전에 챙기세요!">
<meta property="og:title" content="오늘의 핫딜 대첩">
<meta property="og:description" content="오늘 올라온 핫딜을 한눈에. 무지성급 특가부터 확인하세요 🔥">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hotdeal-daecheop.pages.dev/">
<meta property="og:image" content="https://hotdeal-daecheop.pages.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hotdeal-daecheop.pages.dev/og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --text:#111; --sub:#6b7280; --line:#e5e7eb;
    --accent:#ff6b00; --accent2:#ffb800; --price:#111;
    --g1:#ff3b30; --g2:#ff6b00; --g3:#ff9500; --g4:#8e8e93;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b0d14; --card:#151824; --text:#f3f4f6; --sub:#9ca3af; --line:#242838; --price:#fff; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.4;padding-bottom:110px}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:680px;margin:0 auto;padding:16px}

  header{padding:8px 0 4px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .brand h1 span{color:var(--accent)}
  .brand .updated{font-size:12px;color:var(--sub);white-space:nowrap}
  .lead{margin-top:6px;font-size:13px;color:var(--sub)}
  .disclosure{margin-top:10px;font-size:11.5px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

  .tabs{display:flex;gap:8px;margin:14px 0 10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;transition:.15s}
  .tab small{font-size:11px;font-weight:500;color:var(--sub)}
  .tab.active{background:var(--accent2);border-color:var(--accent2);color:#111}
  .tab.active small{color:#5a4200}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .cat{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--sub);cursor:pointer}
  .cat.active{background:var(--text);color:var(--bg);border-color:var(--text)}

  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
  .section-title h2{font-size:16px;font-weight:800}
  .section-title span{font-size:12px;color:var(--sub)}

  .top5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  @media (max-width:520px){.top5{grid-template-columns:repeat(3,1fr)}.top5 .t:nth-child(n+4){display:none}}
  .t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;position:relative;overflow:hidden}
  .t .rank{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;z-index:1}
  .t .thumb{aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
  .t .thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
  .t .n{font-size:11.5px;margin-top:6px;height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .t .p{font-size:13px;font-weight:800;margin-top:3px}
  .t .d{font-size:11px;color:var(--accent);font-weight:700}

  .list{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;transition:transform .1s,box-shadow .15s}
  .card:active{transform:scale(.99)}
  @media (hover:hover){.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08)}}
  .card .thumb{flex:0 0 90px;width:90px;height:90px;border-radius:12px;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px}
  .card .thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
  .card .body{flex:1;min-width:0}
  .card .meta{font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:center}
  .card .meta .cat-badge{background:var(--bg);border-radius:6px;padding:1px 6px}
  .card .name{font-size:14px;font-weight:700;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .pricerow{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
  .card .grade{font-size:12px;font-weight:800}
  .card .price{font-size:18px;font-weight:800;color:var(--price)}
  .card .orig{font-size:12px;color:var(--sub);text-decoration:line-through}
  .card .disc{font-size:12px;font-weight:800;color:var(--accent)}
  .card .chev{color:var(--sub);font-size:18px;flex:0 0 auto}
  .grade.g1{color:var(--g1)} .grade.g2{color:var(--g2)} .grade.g3{color:var(--g3)} .grade.g4{color:var(--g4)}
  .ended{opacity:.5}
  .ended .name::after{content:" · 종료";color:var(--sub);font-weight:500;font-size:12px}

  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
  footer{margin-top:24px;text-align:center;font-size:11.5px;color:var(--sub)}

  .cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .cta a{display:flex;align-items:center;justify-content:center;gap:8px;max-width:648px;margin:0 auto;background:var(--accent2);color:#111;font-weight:800;font-size:15px;border-radius:14px;padding:15px;box-shadow:0 8px 24px rgba(255,184,0,.35)}
  .cta a:active{transform:scale(.99)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div style="display:flex;align-items:center;gap:10px">
        <img src="logo.png" alt="" style="width:44px;height:44px;border-radius:12px;object-fit:cover" onerror="this.style.display='none'">
        <h1>오늘의 <span>핫딜 대첩</span> 🔥</h1>
      </div>
      <div class="updated" id="updated"></div>
    </div>
    <div class="lead">토스쇼핑 오늘의 특가를 할인율 순으로 모았어요. 인기 딜은 빨리 품절돼요!</div>
    <div class="disclosure">이 페이지의 상품 링크는 토스쇼핑 쉐어링크이며, 구매 시 운영자가 수수료를 지급받습니다.</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="cats" id="cats"></div>

  <div id="top5wrap">
    <div class="section-title"><h2>🏆 오늘의 TOP 5</h2><span>할인율 기준</span></div>
    <div class="top5" id="top5"></div>
  </div>

  <div class="section-title"><h2 id="listTitle">방금 올라온 핫딜</h2><span id="listCount"></span></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">아직 올라온 핫딜이 없어요. 잠시 후 다시 확인해주세요 🙏</div>

  <footer>최신 등록순 · 가격은 게시 시점 기준이며 변동될 수 있어요</footer>
</div>

<div class="cta"><a href="https://open.kakao.com/o/pIFobVNi" target="_blank" rel="noopener">🔥 실시간 핫딜알림방 입장하기</a></div>

<script>
const GRADES = [
  {key:"무지성급", label:"무지성급", icon:"🔥🔥🔥🔥", cls:"g1", min:60},
  {key:"초대박",   label:"초대박",   icon:"🔥🔥🔥",   cls:"g2", min:40},
  {key:"대박",     label:"대박",     icon:"🔥🔥",     cls:"g3", min:20},
  {key:"특가",     label:"특가",     icon:"🔥",       cls:"g4", min:0},
];
let deals = [], grade = "전체", cat = "전체";

function timeAgo(ts){
  const s = Math.max(0, Date.now()/1000 - ts);
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s/60) + "분 전";
  if (s < 86400) return Math.floor(s/3600) + "시간 전";
  return Math.floor(s/86400) + "일 전";
}
function won(n){ return (n||0).toLocaleString("ko-KR") + "원"; }
function gradeInfo(g){ return GRADES.find(x=>x.key===g) || GRADES[3]; }
function isEnded(d){ return d.endAt && new Date(d.endAt).getTime() < Date.now(); }
function thumb(d){
  if (!d.thumbnail) return "🛍️";
  return `<img src="${d.thumbnail}" alt="${(d.name||'').replace(/"/g,'')}" loading="lazy" referrerpolicy="no-referrer"
           onerror="this.parentNode.textContent='🛍️'">`;
}

function render(){
  // 탭
  const tabs = document.getElementById("tabs");
  const counts = {};
  deals.forEach(d => counts[d.grade] = (counts[d.grade]||0)+1);
  tabs.innerHTML = [{key:"전체",label:"전체",icon:"✨"}, ...GRADES].map(g => `
    <div class="tab ${grade===g.key?'active':''}" data-g="${g.key}">
      ${g.label}<small>${g.key==="전체" ? deals.length+"개" : g.icon}</small>
    </div>`).join("");
  tabs.querySelectorAll(".tab").forEach(el => el.onclick = () => { grade = el.dataset.g; render(); });

  // 카테고리
  const catList = ["전체", ...Array.from(new Set(deals.map(d=>d.category||"기타")))];
  const cats = document.getElementById("cats");
  cats.innerHTML = catList.length > 2 ? catList.map(c =>
    `<div class="cat ${cat===c?'active':''}" data-c="${c}">${c}</div>`).join("") : "";
  cats.querySelectorAll(".cat").forEach(el => el.onclick = () => { cat = el.dataset.c; render(); });

  // TOP5 (오늘 것 중 할인율 순)
  // 최근 24시간 내 등록된 것 중 할인율 순 (종료된 딜 제외)
  const recent = deals.filter(d => Date.now()/1000 - d.postedAt < 86400 && !isEnded(d));
  const top = [...(recent.length >= 3 ? recent : deals.filter(d=>!isEnded(d)))].sort((a,b)=>(b.discount||0)-(a.discount||0)).slice(0,5);
  document.getElementById("top5wrap").style.display = top.length >= 3 ? "" : "none";
  document.getElementById("top5").innerHTML = top.map((d,i) => `
    <a class="t" href="${d.link}" target="_blank" rel="noopener">
      <div class="rank">${i+1}</div>
      <div class="thumb">${thumb(d)}</div>
      <div class="n">${d.name}</div>
      <div class="p">${won(d.price)}</div>
      <div class="d">${d.discount}%↓</div>
    </a>`).join("");

  // 리스트
  let list = deals.filter(d => (grade==="전체" || d.grade===grade) && (cat==="전체" || (d.category||"기타")===cat));
  list.sort((a,b)=>b.postedAt-a.postedAt);
  document.getElementById("listTitle").textContent = grade==="전체" ? "방금 올라온 핫딜" : `${grade} 핫딜`;
  document.getElementById("listCount").textContent = `${list.length}개 · 최신순`;
  document.getElementById("empty").style.display = list.length ? "none" : "";
  document.getElementById("list").innerHTML = list.map(d => {
    const g = gradeInfo(d.grade);
    return `
    <a class="card ${isEnded(d)?'ended':''}" href="${d.link}" target="_blank" rel="noopener">
      <div class="thumb">${thumb(d)}</div>
      <div class="body">
        <div class="meta"><span>${timeAgo(d.postedAt)}</span>${d.category?`<span class="cat-badge">${d.category}</span>`:""}</div>
        <div class="name">${d.name}</div>
        <div class="pricerow">
          <span class="grade ${g.cls}">${g.label} ${g.icon}</span>
          <span class="price">${won(d.price)}</span>
          ${d.originalPrice && d.originalPrice > d.price ? `<span class="orig">${won(d.originalPrice)}</span>` : ""}
          ${d.discount ? `<span class="disc">${d.discount}%↓</span>` : ""}
        </div>
      </div>
      <div class="chev">›</div>
    </a>`;
  }).join("");
}

fetch("deals.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
    deals = (data.deals || []).map(d => ({...d, grade: d.grade || gradeInfo(GRADES.find(g=>(d.discount||0)>=g.min)?.key).key}));
    if (data.updated) document.getElementById("updated").textContent = "업데이트 " + timeAgo(data.updated);
    render();
  })
  .catch(() => { document.getElementById("empty").style.display = ""; document.getElementById("top5wrap").style.display="none"; });
</script>
</body>
</html>
